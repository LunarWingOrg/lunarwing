x-worker-base: &worker-base
  build:
    context: .
    dockerfile: Dockerfile
  image: lunarwing-worker-codex:latest
  working_dir: /workspace
  group_add:
    - "${HOST_GID:-1000}"
  volumes:
    - ${CODEX_CONFIG_FILE:-./config/codex.toml}:/app/config/codex.toml:ro,z
    - ./workspace:/workspace:z
    - ./logs:/var/log/lunarwing:z
    # Git / SSH credential mounts (optional)
    - ${SSH_DIR:-./.ssh-placeholder}:/home/codex/.host-ssh:ro
    - ${GITCONFIG_FILE:-./.gitconfig-placeholder}:/home/codex/.host-gitconfig:ro
  env_file:
    - path: ${EXTRA_ENV_FILE:-.env.secrets}
      required: false
  environment: &worker-env
    # OpenAI
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    CODEX_MODEL: ${CODEX_MODEL:-codex-mini-latest}
    # LunarWing WebSocket auth
    AGENT_AUTH_TOKEN: ${AGENT_AUTH_TOKEN:-}
    LUNARWING_WORKER_ID: ${LUNARWING_WORKER_ID:-worker-codex-01}
    # Paths
    WORKSPACE_ROOT: /workspace
    # File permissions
    FILE_UMASK: ${FILE_UMASK:-0002}
    # Git / GitHub credentials
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    GH_TOKEN: ${GH_TOKEN:-}
    GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-}
    GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-}
    GIT_COMMITTER_NAME: ${GIT_COMMITTER_NAME:-}
    GIT_COMMITTER_EMAIL: ${GIT_COMMITTER_EMAIL:-}

services:
  codex-worker:
    <<: *worker-base
    command: ["--mode", "websocket"]
    environment:
      <<: *worker-env
      CODEX_MODE: websocket
      WS_ROLE: server
      HEALTH_PORT: ${HEALTH_PORT:-8443}
      WS_BIND_HOST: ${WS_BIND_HOST:-0.0.0.0}
      WS_PORT: ${WS_PORT:-9090}
      WS_PATH: ${WS_PATH:-/ws/agent}
    ports:
      - "${HEALTH_PORT:-8443}:${HEALTH_PORT:-8443}"
      - "${WS_PORT:-9090}:${WS_PORT:-9090}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:${HEALTH_PORT:-8443}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  agent-smoke:
    <<: *worker-base
    profiles: ["smoke"]
    depends_on:
      codex-worker:
        condition: service_healthy
    entrypoint: ["bun", "run", "/app/scripts/smoke_test.ts"]
    command: []
    environment:
      <<: *worker-env
      SMOKE_WS_HOST: codex-worker
      SMOKE_WS_PORT: ${WS_PORT:-9090}
      SMOKE_HEALTH_PORT: ${HEALTH_PORT:-8443}
    restart: "no"

  codex-cli:
    <<: *worker-base
    profiles: ["cli"]
    command: ["--mode", "cli", "--", "${TASK_PROMPT:-Write a hello world Python script}"]
    environment:
      <<: *worker-env
      CODEX_MODE: cli
    stdin_open: true
    tty: true
    restart: "no"
