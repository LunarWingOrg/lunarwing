services:
  pebble-worker:
    build:
      context: ..
      dockerfile: pebble4lunarwing/Dockerfile
    environment:
      - PEBBLE_MODE=websocket
      - PEBBLE_MODEL=${PEBBLE_MODEL:-openai/gpt-5.2}
      - PEBBLE_PERMISSION_MODE=${PEBBLE_PERMISSION_MODE:-danger-full-access}
      - AGENT_AUTH_TOKEN=${AGENT_AUTH_TOKEN:-}
      - LUNARWING_WORKER_ID=${LUNARWING_WORKER_ID:-worker-pebble-01}
      - WS_PORT=9090
      - HEALTH_PORT=8443
      - NANOGPT_API_KEY=${NANOGPT_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "${WS_PORT:-9090}:9090"
      - "${HEALTH_PORT:-8443}:8443"
    volumes:
      - workspace:/workspace
    restart: unless-stopped

  pebble-cli:
    build:
      context: ..
      dockerfile: pebble4lunarwing/Dockerfile
    environment:
      - PEBBLE_MODE=cli
      - PEBBLE_MODEL=${PEBBLE_MODEL:-openai/gpt-5.2}
      - PEBBLE_PERMISSION_MODE=${PEBBLE_PERMISSION_MODE:-danger-full-access}
      - NANOGPT_API_KEY=${NANOGPT_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - workspace:/workspace
    profiles:
      - cli

volumes:
  workspace:
