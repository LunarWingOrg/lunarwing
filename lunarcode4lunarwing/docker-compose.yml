x-worker-base: &worker-base
  build:
    context: .
    dockerfile: Dockerfile
  image: lunarwing-worker-nanocode:latest
  working_dir: /workspace
  group_add:
    - "${HOST_GID:-1000}"
  volumes:
    - ${NANOCODE_CONFIG_FILE:-./config/nanocode.json}:/app/config/nanocode.json:ro,z
    - nanocode-data:/home/nanocode/.local/share/nanocode
    - nanocode-config-home:/home/nanocode/.config/nanocode
    - ./workspace:/workspace:z
    - ./logs:/var/log/lunarwing:z
    - ./results:/app/results:z
  environment: &worker-env
    # LLM / TensorZero
    TENSORZERO_API_KEY: ${TENSORZERO_API_KEY:-dummy}
    NANOGPT_API_KEY: ${NANOGPT_API_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    # nanocode server auth (Basic auth for internal serve endpoint)
    NANOGPT_SERVER_PASSWORD: ${NANOGPT_SERVER_PASSWORD:-}
    NANOGPT_SERVER_USERNAME: ${NANOGPT_SERVER_USERNAME:-nanocode}
    # LunarWing WebSocket auth
    AGENT_AUTH_TOKEN: ${AGENT_AUTH_TOKEN:-}
    LUNARWING_WORKER_ID: ${LUNARWING_WORKER_ID:-worker-nanocode-01}
    # Paths
    WORKSPACE_ROOT: /workspace
    NANOCODE_ROOT: /app/nanocode/packages/opencode
    # File permissions
    FILE_UMASK: ${FILE_UMASK:-0002}

services:
  lunarwing-worker:
    <<: *worker-base
    command: ["--mode", "websocket"]
    environment:
      <<: *worker-env
      NANOCODE_MODE: websocket
      WS_ROLE: server
      HEALTH_PORT: ${HEALTH_PORT:-8443}
      NANOCODE_SERVE_PORT: ${NANOCODE_SERVE_PORT:-4096}
      NANOCODE_SERVE_HOST: ${NANOCODE_SERVE_HOST:-127.0.0.1}
      WS_BIND_HOST: ${WS_BIND_HOST:-0.0.0.0}
      WS_PORT: ${WS_PORT:-9090}
      WS_PATH: ${WS_PATH:-/ws/agent}
    ports:
      - "${HEALTH_PORT:-8443}:${HEALTH_PORT:-8443}"
      - "${WS_PORT:-9090}:${WS_PORT:-9090}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:${HEALTH_PORT:-8443}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  agent-smoke:
    <<: *worker-base
    profiles: ["smoke"]
    depends_on:
      lunarwing-worker:
        condition: service_healthy
    entrypoint: ["bun", "run", "/app/scripts/smoke_test.ts"]
    command: []
    environment:
      <<: *worker-env
      SMOKE_WS_HOST: lunarwing-worker
      SMOKE_WS_PORT: ${WS_PORT:-9090}
      SMOKE_HEALTH_PORT: ${HEALTH_PORT:-8443}
    restart: "no"

  nanocode-cli:
    <<: *worker-base
    profiles: ["cli"]
    command: ["--mode", "cli", "--", "${TASK_PROMPT:-Write a hello world Python script}"]
    environment:
      <<: *worker-env
      NANOCODE_MODE: cli
    stdin_open: true
    tty: true
    restart: "no"

volumes:
  nanocode-data:
  nanocode-config-home:
