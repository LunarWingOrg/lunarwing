version: '3.8'

services:
  ocr-sidecar:
    build: .
    container_name: lunarwing-ocr-sidecar
    ports:
      - "${OCR_PORT:-8088}:8088"
    environment:
      - OCR_PORT=8088
      - LUNARWING_AUTH_TOKEN=${LUNARWING_AUTH_TOKEN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
