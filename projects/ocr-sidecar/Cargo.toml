[package]
name = "lunarwing-ocr-sidecar"
version = "0.1.0"
edition = "2021"

[dependencies]
warp = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
bytes = "1"
reqwest = { version = "0.12", features = ["json"] }
dashmap = "6"
sha2 = "0.10"
governor = "0.8"

[dev-dependencies]
tokio-test = "0.4"
