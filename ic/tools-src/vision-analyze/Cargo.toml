[package]
name = "vision-analyze-tool"
version = "0.2.0"
edition = "2024"
description = "Vision analysis WASM tool for LunarWing - OCR and image understanding"
publish = false
authors = ["LunarWing Team"]                                                                                                                 
license = "AGPL-3.0-or-later"                                                                                                                
homepage = "https://lunarwing.org"                                                                                       
repository = "https://github.com/LunarWingOrg/lunarwing"                                                                                     

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
wit-bindgen = "0.41.0"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1


[workspace]
