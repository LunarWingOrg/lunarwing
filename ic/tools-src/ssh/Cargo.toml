[package]
name = "ssh-tool"
version = "0.1.0"
edition = "2021"
publish = false
authors = ["LunarWing Team"]
license = "AGPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.41"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
strip = true

[workspace]
