[package]
name = "xmpp-channel"
version = "1.1.4"
edition = "2021"
description = "XMPP bridge-backed channel for LunarWing"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
