[package]
name = "multica-channel"
version = "0.1.0"
edition = "2021"
description = "Multica/Lunartica task channel for LunarWing"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.41"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
