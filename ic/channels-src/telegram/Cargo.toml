[package]
name = "telegram-channel"
version = "1.1.5"
edition = "2021"
description = "Telegram Bot API channel for LunarWing"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
# WIT bindgen for WASM component model
wit-bindgen = "0.36"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Exclude from parent workspace (this is a standalone WASM component)

[profile.release]
# Optimize for size
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
