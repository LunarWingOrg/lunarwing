[package]
name = "xmpp-bridge"
version = "1.1.5"
edition = "2024"
description = "Local XMPP bridge for the LunarWing installable XMPP channel"
authors = ["LunarWing Team"]
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
futures = "0.3"
lunarwing = { path = "../.." }
openclaw-xmpp-bridge-contract = { path = "../../openclaw-ports/xmpp/bridge" }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
secrecy = "0.10"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true

[workspace]
